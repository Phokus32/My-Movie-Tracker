// V4.3: missing-metadata batch updater. The tool modifies only TMDB-owned movie fields.
// Personal data, viewing events, favorites, tags and notes are deliberately never assigned.
let bw41Job=null;
const bw41Fields=['tmdbRating','tmdbVotes','director','cast','posterPath','runtime','genres','synopsis'];
function bw41Missing(m){
 return bw41Fields.some(k=>k==='tmdbRating'?m[k]===null||m[k]===undefined||m[k]==='':
 k==='tmdbVotes'?m[k]===null||m[k]===undefined||m[k]==='':
 k==='cast'||k==='genres'?!Array.isArray(m[k])||!m[k].length:
 k==='runtime'?!Number(m[k]):
 !m[k] || (typeof m[k]==='string'&&!m[k].trim()));
}
function bw41Status(msg){const e=$('bw41Status');if(e)e.textContent=msg;}
function bw41UpdateProgress(){
 const j=bw41Job;if(!j)return;
 const bar=$('bw41Progress'),status=$('bw41Status'),summary=$('bw41Summary');
 if(bar){bar.max=j.total||1;bar.value=j.processed;}
 if(status)status.textContent=`${j.processed} of ${j.total} checked · ${j.updated} updated · ${j.skipped} skipped · ${j.review.length} need review · ${j.failed} failed${j.cancel?' · Stopping…':''}`;
 if(summary)summary.textContent=j.running?'Processing movies one at a time. You can stop after the current request.':'';
}
function bw41Sleep(ms){return new Promise(r=>setTimeout(r,ms));}
async function bw41Request(url){
 for(let attempt=0;attempt<5;attempt++){
  if(bw41Job?.running&&bw41Job.cancel)throw new Error('Cancelled');
  let res;
  try{res=await fetch(url,{headers:{Authorization:'Bearer '+tmdbKey,Accept:'application/json'}});}
  catch(e){if(attempt===4)throw e;await bw41Sleep(Math.min(15000,1200*2**attempt));continue;}
  if(res.status===429||res.status>=500){
   if(attempt===4)throw new Error('TMDB request failed ('+res.status+')');
   const retry=Number(res.headers.get('Retry-After'));
   await bw41Sleep(Number.isFinite(retry)&&retry>0?Math.min(retry*1000,60000):Math.min(30000,1500*2**attempt));
   continue;
  }
  if(!res.ok)throw new Error('TMDB returned '+res.status);
  return await res.json();
 }
}
function bw41MatchCandidates(m,results){
 const title=String(m.title||'').toLowerCase().trim(),year=Number(m.year)||0;
 const normalized=x=>String(x||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
 const t=normalized(title);
 return (results||[]).filter(r=>normalized(r.title)===t||normalized(r.original_title)===t)
 .map(r=>({...r,bwYear:Number(String(r.release_date||'').slice(0,4))||0}))
 .filter(r=>!year||!r.bwYear||Math.abs(r.bwYear-year)<=1);
}
function bw41Apply(m,d){
 const fields={tmdbRating:Number.isFinite(Number(d.vote_average))?Number(d.vote_average):null,
 tmdbVotes:Number.isFinite(Number(d.vote_count))?Number(d.vote_count):null,
 director:(d.credits?.crew||[]).find(p=>p.job==='Director')?.name||'',
 cast:(d.credits?.cast||[]).slice(0,8).map(p=>p.name),
 posterPath:d.poster_path||'',
 runtime:Number(d.runtime)||null,
 genres:(d.genres||[]).map(g=>g.name),
 synopsis:d.overview||''};
 let changed=false;
 for(const [k,value] of Object.entries(fields)){
  const missing=k==='tmdbRating'||k==='tmdbVotes'?m[k]===null||m[k]===undefined||m[k]==='':
   Array.isArray(value)?!Array.isArray(m[k])||m[k].length===0:
   k==='runtime'?!Number(m[k]):!m[k]||!String(m[k]).trim();
  const valid=Array.isArray(value)?value.length>0:value!==null&&value!==undefined&&value!=='';
  if(missing&&valid){m[k]=value;changed=true;}
 }
 if(!m.tmdbId&&d.id){m.tmdbId=String(d.id);changed=true;}
 if(changed){m.metadataProvider='TMDB';m.metadataRefreshedAt=new Date().toISOString();}
 return changed;
}
async function bw41Run(){
 if(bw41Job?.running)return;
 if(!tmdbKey){bw41Status('Save your TMDB Read Access Token in Settings first.');return;}
 if(cloudConflict){bw41Status('Resolve your cloud-sync conflict before refreshing metadata.');return;}
 if(!confirm('Refresh missing TMDB metadata for '+bw43RefreshMovies().filter(bw41Missing).length+' logged movies? Watchlist-only and unreferenced movie records are excluded. Export a JSON backup first.'))return;
 const list=bw43RefreshMovies().filter(bw41Missing).map(m=>m.id);
 bw41Job={running:true,cancel:false,total:list.length,processed:0,updated:0,skipped:0,failed:0,review:[],errors:[]};
 $('bw41Start').disabled=true;$('bw41Stop').disabled=false;$('bw41Review').innerHTML='';
 bw41UpdateProgress();
 for(const id of list){
  if(bw41Job.cancel)break;
  const m=movie(id);if(!m){bw41Job.skipped++;bw41Job.processed++;continue;}
  try{
   let idToFetch=m.tmdbId;
   if(!idToFetch){
    const query=encodeURIComponent(m.title||'');
    const result=await bw41Request('https://api.themoviedb.org/3/search/movie?query='+query+'&include_adult=false&language=en-US&page=1');
    const candidates=bw41MatchCandidates(m,result.results);
    if(candidates.length===1 && Number(m.year) && candidates[0].bwYear===Number(m.year)){
     idToFetch=candidates[0].id;
    }else{
     bw41Job.review.push({movieId:id,title:m.title,year:m.year,candidates:candidates.slice(0,6)});
     bw41Job.processed++;bw41UpdateProgress();await bw41Sleep(260);continue;

const bw74Menu=$('menuBtn');if(bw74Menu)bw74Menu.onclick=()=>{const current=state.uiSettings?.bw43LogView||'list';openModal('Navigation',`<div class="navlist">${navItems().map(([id,ic,label])=>`<button class="navbtn" data-modalpage="${id}"><span class="navicon">${ic}</span>${label}</button>`).join('')}</div><div style="margin-top:12px;padding:10px;border-top:1px solid var(--line)"><div class="side-label">MOVIE LOG VIEW</div><div style="display:flex;gap:8px"><button class="btn ${current==='list'?'primary':''}" data-bw74-view="list">List View</button><button class="btn ${current==='posters'?'primary':''}" data-bw74-view="posters">Poster View</button></div></div>`, '<button class="btn" id="closeNav">Close</button>');$('closeNav').onclick=closeModal;document.querySelectorAll('[data-modalpage]').forEach(b=>b.onclick=()=>{closeModal();go(b.dataset.modalpage)});document.querySelectorAll('[data-bw74-view]').forEach(b=>b.onclick=()=>{state.uiSettings??={};state.uiSettings.bw43LogView=b.dataset.bw74View;state.uiSettings.grid=b.dataset.bw74View==='posters';save();closeModal();go('log')})};
// Larger poster and compact details, preserving existing functional detail controls.
const bw74Detail=renderDetail;renderDetail=function(){bw74Detail();const m=movie(activeMovie);if(!m)return;const panel=$('main')?.querySelector('.panel'),old=panel?.querySelector('.detail-card');if(!old)return;const hero=document.createElement('div');hero.className='bw74-hero';if(m.posterPath){const img=document.createElement('img');img.src='https://image.tmdb.org/t/p/w780'+m.posterPath;img.alt='Poster for '+m.title;hero.appendChild(img)}else hero.innerHTML='<div class="poster-placeholder" style="min-height:180px">'+esc(m.title)+'</div>';panel.insertBefore(hero,old);old.querySelector('.poster-placeholder')?.remove();old.style.display='block'};
