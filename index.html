<style>

nt:space-between;color:var(--muted);font-size:12px;margin:12px 2px}.movie-list{display:grid;gap:8px}.movie-row{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px 15px;display:grid;grid-template-columns:minmax(0,1.65fr) minmax(115px,.85fr) minmax(100px,.65fr) auto;gap:14px;align-items:center;transition:border-color .15s}.movie-row:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}.mov-title{font-weight:750;font-size:14px;line-height:1.35}.mov-sub{color:var(--muted);font-size:11px;margin-top:5px}.pill{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 8px;font-size:10px;color:var(--muted);white-space:nowrap}.pill.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 35%,var(--line))}.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,var(--line))}.pill.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}.rating{font-size:16px;font-weight:800;white-space:nowrap}.rating em{font-style:normal;color:var(--muted);font-size:10px;font-weight:500}.row-actions{display:flex;gap:6px}.row-actions button{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:7px 8px}.empty{border:1px dashed var(--line);border-radius:16px;padding:46px 20px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--text);font-size:16px;margin-bottom:7px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;margin-bottom:20px}.stat{padding:17px;border:1px solid var(--line);background:var(--panel);border-radius:14px}.stat label{font-size:11px;color:var(--muted)}.stat strong{display:block;font-size:28px;letter-spacing:-.04em;margin:8px 0 3px}.stat small{font-size:11px;color:var(--muted)}.dashboard-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:18px;min-width:0}.panel h3{font-size:14px;margin:0 0 15px}.panel .subhead{font-size:11px;color:var(--muted);margin-top:-9px;margin-bottom:15px}.chart{height:170px;display:flex;align-items:end;gap:9px;padding:10px 3px 0;border-bottom:1px solid var(--line)}.barcol{height:100%;flex:1;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:8px;min-width:0}.bar{width:min(28px,72%);min-height:3px;border-radius:5px 5px 0 0;background:var(--accent);opacity:.9}.barlabel{font-size:10px;color:var(--muted)}.ranklist{display:grid;gap:8px}.rankrow{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.rankrow:last-child{border-bottom:0}.ranknum{color:var(--muted);width:20px;font-size:11px}.rankname{flex:1;font-size:12px;font-weight:650}.rankyear{font-size:10px;color:var(--muted);margin-top:3px}.rankrating{font-size:13px;font-weight:800}.year-control{display:flex;gap:6px;align-items:center}.year-control select{width:100px}.watch-priority{min-width:78px;text-align:center}.detail-card{display:grid;grid-template-columns:140px minmax(0,1fr);gap:22px}.poster-placeholder{aspect-ratio:2/3;border-radius:12px;background:linear-gradient(145deg,var(--panel2),var(--bg));border:1px solid var(--line);display:grid;place-items:center;text-align:center;padding:12px;color:var(--muted);font-size:12px}.detail-title{font-size:27px;letter-spacing:-.04em;margin:0 0 5px}.detail-meta{color:var(--muted);font-size:12px;margin-bottom:16px}.detail-buttons{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.detail-info{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:17px 0}.detail-info div{padding:11px;background:var(--panel2);border-radius:9px}.detail-info label{display:block;color:var(--muted);font-size:10px;margin-bottom:5px}.detail-info strong{font-size:13px}.section-title{font-size:14px;margin:23px 0 10px}.viewing-card{border:1px solid var(--line);border-radius:11px;padding:13px;margin-bottom:8px}.viewing-top{display:flex;justify-content:space-between;gap:10px;font-size:12px;font-weight:700}.viewing-notes{font-size:12px;color:var(--muted);margin-top:8px;white-space:pre-wrap}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.formgrid .wide{grid-column:1/-1}.checkline{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--muted)}.checkline input{width:auto}.modal-backdrop{position:fixed;inset:0;background:#0009;z-index:20;display:none;align-items:center;justify-content:center;padding:15px}.modal-backdrop.open{display:flex}.modal{width:min(680px,100%);max-height:92vh;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:22px}.modalhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.modalhead h2{font-size:20px;margin:0}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;flex-wrap:wrap}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--text);color:var(--bg);padding:12px 16px;border-radius:11px;z-index:50;font-size:13px;box-shadow:var(--shadow);transition:.2s;max-width:90vw}.toast.show{opacity:1;transform:translate(-50%,0)}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.setting-item{border:1px solid var(--line);background:var(--panel);border-radius:13px;padding:16px}.setting-item h3{font-size:14px;margin:0 0 7px}.setting-item p{font-size:12px;line-height:1.5;color:var(--muted);margin:0 0 13px}.footer-note{font-size:11px;line-height:1.6;color:var(--muted);margin-top:18px}.mobile-nav{display:none}.hide{display:none!important}

<body><div class="app">
<header class="topbar"><div class="brandmark">M</div><div class="brand">MY MOVIE TRACKER<small>YOUR PERSONAL FILM ARCHIVE</small></div><div class="top-spacer"></div><div class="status"><span class="dot"></span><span id="saveStatus">Saved on this device</span></div><button class="iconbtn" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">☼</button><button class="iconbtn" id="menuBtn" aria-label="Open navigation" title="Navigation">☰</button></header>
<div class="layout"><aside class="sidebar"><div class="side-label">LIBRARY</div><nav class="navlist" id="sideNav"></nav><div class="sidebar-note"><strong style="color:var(--text)">Private by design</strong><br>This first build saves your records in this browser on this device. Cloud sync is not connected yet.</div></aside><main class="main" id="main"></main></div>
<nav class="mobile-nav" id="mobileNav"></nav></div>
<div class="modal-backdrop" id="modalBackdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modalhead"><h2 id="modalTitle">Add movie</h2><button class="iconbtn" id="modalClose" aria-label="Close">×</button></div><div id="modalBody"></div><div class="modalfoot" id="modalFoot"></div></section></div><div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(()=>{'use strict';
const KEY='myMovieTracker.v1';const PREF='myMovieTracker.prefs';const today=()=>new Date().toISOString().slice(0,10);const uid=()=>crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(16).slice(2);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dateFmt=d=>d?new Date(d+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}):'—';const yearOf=d=>d?Number(d.slice(0,4)):null;let state=loadState();let prefs=loadPrefs();let page=prefs.page||'log',activeMovie=null,editingViewing=null,editingMovie=null,undoData=null,toastTimer=null;
function loadState(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.movies)&&Array.isArray(x.viewings)&&Array.isArray(x.watchlist))return x}catch(e){}return{movies:[],viewings:[],watchlist:[],tags:[],lastSaved:null};}function loadPrefs(){try{return Object.assign({theme:'dark',page:'log',sort:'start-desc',group:'none',year:new Date().getFullYear(),language:'preferred',filters:false},JSON.parse(localStorage.getItem(PREF)||'{}'))}catch(e){return{theme:'dark',page:'log',sort:'start-desc',group:'none',year:new Date().getFullYear(),language:'preferred',filters:false}}}
const CLOUD_CONFIG_KEY='myMovieTracker.supabase.config.v1';let cloudConfig=readCloudConfig(),cloudClient=null,cloudUser=null,cloudReady=false,cloudSyncTimer=null,cloudSyncChain=Promise.resolve(),cloudConflict=false;
function readCloudConfig(){try{return JSON.parse(localStorage.getItem(CLOUD_CONFIG_KEY)||'null')}catch(e){return null}}
function setCloudStatus(msg){const el=$('cloudStatusText');if(el)el.textContent=msg;const pill=$('cloudStatusPill');if(pill){pill.textContent=cloudUser?(cloudReady?'Cloud connected':'Sign-in ready'): (cloudConfig?'Not signed in':'Not configured');pill.className='pill '+(cloudUser&&cloudReady?'good':'warn')}}
function stateHasRecords(x=state){return (x.movies||[]).length+(x.viewings||[]).length+(x.watchlist||[]).length>0}
function save(){state.lastSaved=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(state));$('saveStatus').textContent=cloudUser&&cloudReady?'Saved on this device · syncing…':'Saved on this device';}catch(e){$('saveStatus').textContent='Save failed';toast('Could not save. Browser storage may be full.');}try{localStorage.setItem(PREF,JSON.stringify({...prefs,page}));}catch(e){}if(cloudUser&&cloudReady){clearTimeout(cloudSyncTimer);cloudSyncTimer=setTimeout(()=>syncCloudState(),700)}}
function initCloudClient(){if(!cloudConfig?.url||!cloudConfig?.key||!window.supabase?.createClient){cloudClient=null;return false}try{cloudClient=window.supabase.createClient(cloudConfig.url,cloudConfig.key);cloudClient.auth.onAuthStateChange((event,session)=>{if(event!=='INITIAL_SESSION')setTimeout(()=>handleCloudSession(session),0)});cloudClient.auth.getSession().then(({data,error})=>{if(error)setCloudStatus('Could not restore sign-in: '+error.message);else handleCloudSession(data.session)});return true}catch(e){cloudClient=null;setCloudStatus('Cloud setup failed: '+e.message);return false}}
async function handleCloudSession(session){cloudUser=session?.user||null;cloudReady=false;cloudConflict=false;if(!cloudUser){setCloudStatus(cloudConfig?'Not signed in. Local data remains available.':'Cloud not configured.');renderCloudControls();return}setCloudStatus('Signed in. Checking cloud data…');renderCloudControls();try{const {data,error}=await cloudClient.from('movie_tracker_data').select('payload,updated_at').eq('user_id',cloudUser.id).maybeSingle();if(error)throw error;if(!data){cloudReady=true;await syncCloudState(true);setCloudStatus('Connected. Your local library was uploaded to your cloud account.');}else if(stateHasRecords()&&stableStringify(normalizeState(state))!==stableStringify(normalizeState(data.payload))){cloudConflict=true;setCloudStatus('Both this device and cloud have data. Choose which copy to keep.');}else{state=normalizeState(data.payload);localStorage.setItem(KEY,JSON.stringify(state));cloudReady=true;render();setCloudStatus('Connected. Cloud library loaded.');}renderCloudControls()}catch(e){cloudReady=false;setCloudStatus('Cloud connection error: '+(e.message||'Check your setup and SQL table.'));renderCloudControls()}}
function normalizeState(x){return{movies:Array.isArray(x?.movies)?x.movies:[],viewings:Array.isArray(x?.viewings)?x.viewings:[],watchlist:Array.isArray(x?.watchlist)?x.watchlist:[],tags:Array.isArray(x?.tags)?x.tags:[],lastSaved:x?.lastSaved||new Date().toISOString()}}function stableStringify(x){if(Array.isArray(x))return '['+x.map(stableStringify).join(',')+']';if(x&&typeof x==='object')return '{'+Object.keys(x).sort().map(k=>JSON.stringify(k)+':'+stableStringify(x[k])).join(',')+'}';return JSON.stringify(x)}
async function syncCloudState(force=false){if(!cloudClient||!cloudUser||(!cloudReady&&!force)||cloudConflict)return;const payload=normalizeState(state);cloudSyncChain=cloudSyncChain.then(async()=>{const {error}=await cloudClient.from('movie_tracker_data').upsert({user_id:cloudUser.id,payload,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)throw error;const el=$('saveStatus');if(el)el.textContent='Saved to cloud';setCloudStatus('Connected. Changes saved to cloud.');}).catch(e=>{const el=$('saveStatus');if(el)el.textContent='Local save OK · cloud sync failed';setCloudStatus('Sync failed: '+(e.message||'Check your connection.'));});return cloudSyncChain}
async function useCloudCopy(){if(!cloudClient||!cloudUser)return;try{const {data,error}=await cloudClient.from('movie_tracker_data').select('payload').eq('user_id',cloudUser.id).single();if(error)throw error;state=normalizeState(data.payload);localStorage.setItem(KEY,JSON.stringify(state));cloudConflict=false;cloudReady=true;render();setCloudStatus('Cloud copy loaded on this device.');renderCloudControls();toast('Cloud library loaded')}catch(e){toast('Could not load cloud data: '+e.message)}}
async function uploadLocalCopy(){if(!cloudClient||!cloudUser)return;if(!confirm('Replace the cloud library with the data currently on this device? Export a JSON backup first if unsure.'))return;cloudConflict=false;cloudReady=true;await syncCloudState(true);renderCloudControls();toast('Local library uploaded to cloud')}
function renderCloudControls(){const status=$('cloudStatusText');if(status)status.textContent=cloudConflict?'Both this device and cloud have data. Choose which copy to keep.':cloudUser?(cloudReady?'Signed in as '+cloudUser.email:'Signed in as '+cloudUser.email+' · checking cloud…'):cloudConfig?'Cloud configured, not signed in.':'Enter your Supabase project URL and publishable/anon key.';const pill=$('cloudStatusPill');if(pill){pill.textContent=cloudConflict?'Action required':cloudUser?(cloudReady?'Connected':'Connecting'):(cloudConfig?'Not signed in':'Not configured');pill.className='pill '+(cloudUser&&cloudReady?'good':'warn')}['cloudEmail','cloudPassword','cloudUrl','cloudKey','cloudSetup','cloudSignIn','cloudSignUp'].forEach(id=>{const e=$(id);if(e&&cloudUser&&['cloudEmail','cloudPassword','cloudSignIn','cloudSignUp'].includes(id))e.disabled=true;else if(e)e.disabled=false});const signout=$('cloudSignOut');if(signout){signout.classList.toggle('hide',!cloudUser);signout.style.display=cloudUser?'inline-flex':'none';}const resolve=$('cloudResolveButtons');if(resolve)resolve.classList.toggle('hide',!cloudConflict);const auth=$('cloudAuthButtons');if(auth)auth.classList.toggle('hide',!!cloudUser)}
async function saveCloudConfig(){const url=$('cloudUrl').value.trim().replace(/\/$/,'');const key=$('cloudKey').value.trim();if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url)){toast('Enter the project URL from Supabase.');return}if(!key||key.length<20){toast('Enter the publishable/anon key from Supabase.');return}cloudConfig={url,key};localStorage.setItem(CLOUD_CONFIG_KEY,JSON.stringify(cloudConfig));cloudClient=null;cloudUser=null;cloudReady=false;if(!initCloudClient()){toast('Could not initialize Supabase.');return}setCloudStatus('Supabase configured. Checking sign-in…');renderCloudControls();toast('Cloud settings saved on this device')}
async function cloudSignIn(signUp=false){if(!cloudClient){toast('Save your Supabase settings first.');return}const email=$('cloudEmail').value.trim(),password=$('cloudPassword').value;if(!email||!password){toast('Enter your email and password.');return}setCloudStatus(signUp?'Creating account…':'Signing in…');const result=signUp?await cloudClient.auth.signUp({email,password}):await cloudClient.auth.signInWithPassword({email,password});if(result.error){setCloudStatus(result.error.message);toast(result.error.message);return}if(signUp&&!result.data.session){setCloudStatus('Account created. Check your email to confirm, then sign in.');toast('Check your email to confirm the account.')}else{toast(signUp?'Account created':'Signed in')}}
async function cloudSignOut(){if(cloudClient){const {error}=await cloudClient.auth.signOut();if(error){toast('Sign-out failed: '+error.message);return}}cloudUser=null;cloudReady=false;cloudConflict=false;setCloudStatus('Signed out. Local data remains on this device.');renderCloudControls();toast('Signed out')}

function $(id){return document.getElementById(id)}function toast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2600)}function movie(id){return state.movies.find(m=>m.id===id)}function viewsFor(id){return state.viewings.filter(v=>v.movieId===id)}function statusName(v){return v.status==='completed'?'Completed':v.status==='dnf'?'Did Not Finish':'In Progress'}function pill(v){return `<span class="pill ${v.status==='completed'?'good':v.status==='dnf'?'bad':'warn'}">${statusName(v)}</span>`}function ratingText(r){return r===null||r===undefined||r===''?'—':`${Number(r).toFixed(1)}<em>/10</em>`}function titleOf(m){return prefs.language==='original'?(m.originalTitle||m.title):m.title}function navItems(){return[['log','▤','Movie Log'],['dashboard','▥','Dashboard'],['watchlist','◷','Watchlist'],['settings','⚙','Settings']]}function renderNav(){let html=navItems().map(([id,ic,label])=>`<button class="navbtn ${page===id?'active':''}" data-page="${id}"><span class="navicon">${ic}</span><span>${label}</span></button>`).join('');$('sideNav').innerHTML=html;$('mobileNav').innerHTML=html;document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));}

function openWatchlistForm(id=null){const w=id?state.watchlist.find(x=>x.id===id):null;let body=`<form id="watchForm"><div class="formgrid"><div class="field wide"><label>Movie title *</label><input id="wTitle" required value="${esc(movie(w?.movieId)?.title||'')}" placeholder="Enter a movie title"></div><div class="field"><label>Release year</label><input id="wYear" type="number" min="1888" max="2100" value="${esc(movie(w?.movieId)?.year||'')}"></div><div class="field"><label>Priority</label><select id="wPriority"><option value="high">High</option><option value="normal">Normal</option><option value="low">Low</option></select></div><div class="field wide"><label>Watchlist notes</label><textarea id="wNotes" rows="3" placeholder="Why is this on your list?">${esc(w?.notes||'')}</textarea></div></div></form>`;openModal(w?'Edit watchlist item':'Add to Watchlist',body,`<button class="btn" id="cancelWatch">Cancel</button><button class="btn primary" id="saveWatch">Save</button>`);$('wPriority').value=w?.priority||'normal';$('cancelWatch').onclick=closeModal;$('saveWatch').onclick=()=>{let title=$('wTitle').value.trim();if(!title){toast('Movie title is required.');return}let m=movie(w?.movieId)||state.movies.find(x=>x.title.toLowerCase()===title.toLowerCase()&&String(x.year||'')===String($('wYear').value||''));if(!m){m={id:uid(),title,year:$('wYear').value?Number($('wYear').value):null,genres:[],tags:[],notes:'',favorite:false,createdAt:new Date().toISOString()};state.movies.push(m)}else{m.title=title;if($('wYear').value)m.year=Number($('wYear').value)}let rec=w||{id:uid(),movieId:m.id,addedAt:new Date().toISOString()};Object.assign(rec,{movieId:m.id,priority:$('wPriority').value,notes:$('wNotes').value.trim()});if(!w)state.watchlist.push(rec);save();closeModal();renderWatchlist();toast('Watchlist saved')};}
function renderDashboard(){const y=Number(prefs.year)||new Date().getFullYear();const allCompleted=state.viewings.filter(v=>v.status==='completed');const yearViews=allCompleted.filter(v=>yearOf(v.startDate)===y);const unique=new Set(yearViews.map(v=>v.movieId)).size;const rated=yearViews.filter(v=>v.rating!==null&&v.rating!==undefined);const avg=rated.length?(rated.reduce((s,v)=>s+Number(v.rating),0)/rated.length).toFixed(1):'—';const months=Array(12).fill(0);yearViews.forEach(v=>{if(v.startDate)months[Number(v.startDate.slice(5,7))-1]++});const max=Math.max(1,...months);const uniqueAll=new Set(allCompleted.map(v=>v.movieId)).size;const avgAll=allCompleted.filter(v=>v.rating!==null&&v.rating!==undefined).length? (allCompleted.filter(v=>v.rating!==null&&v.rating!==undefined).reduce((s,v)=>s+Number(v.rating),0)/allCompleted.filter(v=>v.rating!==null&&v.rating!==undefined).length).toFixed(1):'—';const rankings=year=>{let list=state.movies.map(m=>{let vs=state.viewings.filter(v=>v.movieId===m.id&&v.status==='completed'&&v.rating!==null&&v.rating!==undefined&&(!year||yearOf(v.startDate)===year)).sort((a,b)=>(b.startDate||'').localeCompare(a.startDate||''));if(!vs.length)return null;let score=year?Number(vs[0].rating):vs.reduce((s,v)=>s+Number(v.rating),0)/vs.length;return{m,score,count:vs.length}}).filter(Boolean);return{top:list.slice().sort((a,b)=>b.score-a.score||a.m.title.localeCompare(b.m.title)).slice(0,50),bottom:list.slice().sort((a,b)=>a.score-b.score||a.m.title.localeCompare(b.m.title)).slice(0,50)}};const r=rankings(y);const genres={};yearViews.forEach(v=>(movie(v.movieId)?.genres||[]).forEach(g=>genres[g]=(genres[g]||0)+1));const gtop=Object.entries(genres).sort((a,b)=>b[1]-a[1]).slice(0,8);const streak=calcStreak(allCompleted);$('main').innerHTML=pageHead('YOUR HISTORY','Dashboard','The shape of your movie-watching year.',`<div class="year-control"><button class="iconbtn" id="yearPrev" aria-label="Previous year">‹</button><select id="dashYear" aria-label="Dashboard year">${Array.from({length:Math.max(8,new Date().getFullYear()-Math.min(...state.viewings.map(v=>yearOf(v.startDate)).filter(Boolean),new Date().getFullYear())+2)},(_,i)=>new Date().getFullYear()+1-i).map(n=>`<option value="${n}" ${n===y?'selected':''}>${n}</option>`).join('')}<option value="all">All time</option></select><button class="iconbtn" id="yearNext" aria-label="Next year">›</button></div>`)+`<div class="cards"><div class="stat"><label>Unique movies · ${y}</label><strong>${unique}</strong><small>Completed titles</small></div><div class="stat"><label>Viewing events · ${y}</label><strong>${yearViews.length}</strong><small>Completed viewings</small></div><div class="stat"><label>Average rating · ${y}</label><strong>${avg}</strong><small>Rated viewings only</small></div><div class="stat"><label>Longest streak</label><strong>${streak}</strong><small>Consecutive days</small></div></div><div class="dashboard-grid"><section class="panel"><h3>Monthly activity</h3><div class="subhead">Completed viewing events by start date</div><div class="chart">${months.map((n,i)=>`<div class="barcol"><div class="bar" title="${n} viewing events" style="height:${Math.max(n?5:2,n/max*100)}%"></div><div class="barlabel">${['J','F','M','A','M','J','J','A','S','O','N','D'][i]}</div></div>`).join('')}</div></section><section class="panel"><h3>Genre breakdown</h3><div class="subhead">Based on available movie genres</div>${gtop.length?gtop.map(([g,n])=>`<div style="margin:12px 0"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px"><span>${esc(g)}</span><span style="color:var(--muted)">${n}</span></div><div style="height:5px;border-radius:99px;background:var(--panel2);overflow:hidden"><div style="height:100%;width:${n/gtop[0][1]*100}%;background:var(--accent)"></div></div></div>`).join(''):'<div class="empty">Add genres to movie records to see this breakdown.</div>'}</section><section class="panel"><h3>Top rated · ${y}</h3><div class="subhead">Latest rating in this year · one row per movie</div>${rankHtml(r.top.slice(0,5))}<button class="btn small" data-rank="top-year">View top 50</button></section><section class="panel"><h3>Lowest rated · ${y}</h3><div class="subhead">Latest rating in this year · one row per movie</div>${rankHtml(r.bottom.slice(0,5))}<button class="btn small" data-rank="bottom-year">View bottom 50</button></section><section class="panel"><h3>All-time snapshot</h3><div class="detail-info"><div><label>Unique movies</label><strong>${uniqueAll}</strong></div><div><label>Viewing events</label><strong>${allCompleted.length}</strong></div><div><label>Average rating</label><strong>${avgAll}</strong></div></div><div style="font-size:12px;color:var(--muted)">Completed movies only. All-time average uses every rated completed viewing.</div><div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:14px"><button class="btn small" data-rank="top-all">All-time top 50</button><button class="btn small" data-rank="bottom-all">All-time bottom 50</button></div></section><section class="panel"><h3>Viewing with your wife</h3><div class="detail-info"><div><label>With wife</label><strong>${yearViews.filter(v=>v.watchedWithWife==='yes').length}</strong></div><div><label>Solo</label><strong>${yearViews.filter(v=>v.watchedWithWife==='no').length}</strong></div><div><label>Unknown</label><strong>${yearViews.filter(v=>v.watchedWithWife==='unknown'||!v.watchedWithWife).length}</strong></div></div><div style="font-size:12px;color:var(--muted)">Counts completed viewings started in ${y}.</div></section></div>`;$('yearPrev').onclick=()=>{prefs.year=y-1;save();renderDashboard()};$('yearNext').onclick=()=>{prefs.year=y+1;save();renderDashboard()};$('dashYear').onchange=e=>{if(e.target.value==='all'){showAllTimeDashboard();return}prefs.year=Number(e.target.value);save();renderDashboard()};document.querySelectorAll('[data-rank]').forEach(b=>b.onclick=()=>showRankings(b.dataset.rank,y));}
function rankHtml(list){return list.length?`<div class="ranklist">${list.map((r,i)=>`<div class="rankrow"><span class="ranknum">${String(i+1).padStart(2,'0')}</span><div class="rankname">${esc(titleOf(r.m))}<div class="rankyear">${esc(r.m.year||'Year unknown')}</div></div><span class="rankrating">${r.score.toFixed(1)}</span></div>`).join('')}</div>`:'<div class="empty">No rated completed movies yet.</div>'}function showRankings(kind,y){let year=kind.endsWith('year')?y:null;let bottom=kind.startsWith('bottom');let list=state.movies.map(m=>{let vs=state.viewings.filter(v=>v.movieId===m.id&&v.status==='completed'&&v.rating!==null&&v.rating!==undefined&&(!year||yearOf(v.startDate)===year)).sort((a,b)=>(b.startDate||'').localeCompare(a.startDate||''));if(!vs.length)return null;return{m,score:year?Number(vs[0].rating):vs.reduce((s,v)=>s+Number(v.rating),0)/vs.length}}).filter(Boolean).sort((a,b)=>bottom?a.score-b.score||a.m.title.localeCompare(b.m.title):b.score-a.score||a.m.title.localeCompare(b.m.title)).slice(0,50);openModal((bottom?'Bottom':'Top')+' 50 · '+(year||'All time'),`<div class="ranklist">${list.length?list.map((r,i)=>`<div class="rankrow"><span class="ranknum">${i+1}</span><button data-rankdetail="${r.m.id}" class="rankname" style="border:0;background:none;text-align:left;color:var(--text)">${esc(titleOf(r.m))}<div class="rankyear">${esc(r.m.year||'')}</div></button><span class="rankrating">${r.score.toFixed(1)}</span></div>`).join(''):'<div class="empty">No ranked movies yet.</div>'}</div>`,`<button class="btn" id="closeRank">Close</button>`);$('closeRank').onclick=closeModal;document.querySelectorAll('[data-rankdetail]').forEach(b=>b.onclick=()=>{closeModal();openDetail(b.dataset.rankdetail)})}
function showAllTimeDashboard(){const y=Number(prefs.year);const all=state.viewings.filter(v=>v.status==='completed');const rated=all.filter(v=>v.rating!==null&&v.rating!==undefined);const avg=rated.length?(rated.reduce((s,v)=>s+Number(v.rating),0)/rated.length).toFixed(1):'—';const mcount=new Set(all.map(v=>v.movieId)).size;$('main').innerHTML=pageHead('YOUR HISTORY','All-time Dashboard','Your complete viewing record.',`<button class="btn" id="backYear">← Yearly view</button>`)+`<div class="cards"><div class="stat"><label>Unique movies</label><strong>${mcount}</strong></div><div class="stat"><label>Viewing events</label><strong>${all.length}</strong></div><div class="stat"><label>Rated viewings</label><strong>${rated.length}</strong></div><div class="stat"><label>Average rating</label><strong>${avg}</strong></div></div><div class="dashboard-grid"><section class="panel"><h3>All-time top 50</h3>${rankHtml(allRank(false).slice(0,10))}<button class="btn small" id="allTop">View top 50</button></section><section class="panel"><h3>All-time bottom 50</h3>${rankHtml(allRank(true).slice(0,10))}<button class="btn small" id="allBottom">View bottom 50</button></section></div>`;$('backYear').onclick=()=>renderDashboard();$('allTop').onclick=()=>showRankings('top-all',null);$('allBottom').onclick=()=>showRankings('bottom-all',null)}function allRank(bottom){return state.movies.map(m=>{let vs=viewsFor(m.id).filter(v=>v.status==='completed'&&v.rating!==null&&v.rating!==undefined);return vs.length?{m,score:vs.reduce((s,v)=>s+Number(v.rating),0)/vs.length}:null}).filter(Boolean).sort((a,b)=>bottom?a.score-b.score||a.m.title.localeCompare(b.m.title):b.score-a.score||a.m.title.localeCompare(b.m.title))}
function calcStreak(vs){let days=[...new Set(vs.flatMap(v=>[v.startDate,v.finishDate]).filter(Boolean))].sort();let best=0,run=0,prev=null;for(let d of days){let dt=new Date(d+'T12:00:00');if(prev&&((dt-prev)/86400000)===1)run++;else run=1;best=Math.max(best,run);prev=dt}return best}
function renderSettings(){$('main').innerHTML=pageHead('PREFERENCES','Settings','Manage appearance and your movie data.')+`<div class="settings-grid"><section class="setting-item"><h3>Appearance</h3><p>Choose a theme for this device. Your preference is saved locally.</p><button class="btn" id="settingTheme">Switch to ${prefs.theme==='dark'?'light':'dark'} theme</button></section><section class="setting-item"><h3>Movie title display</h3><p>Choose which title appears in the main log. Search still checks both.</p><select id="titlePref"><option value="preferred">English / preferred title</option><option value="original">Original title when available</option></select></section><section class="setting-item"><h3>Export your data</h3><p>Download a complete JSON backup or spreadsheet-friendly CSV files. Keep exports somewhere safe.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="exportJson">Export JSON</button><button class="btn" id="exportCsv">Export CSV</button></div></section><section class="setting-item"><h3>Import data</h3><p>Import a JSON backup exported by this app. Review the file before replacing your current data.</p><input type="file" id="importFile" accept=".json,application/json" style="margin-bottom:10px"><button class="btn" id="importBtn">Import JSON backup</button></section><section class="setting-item"><h3>Local storage</h3><p id="storageInfo">Checking storage…</p><button class="btn" id="storageRefresh">Refresh status</button></section><section class="setting-item"><h3>Sample data</h3><p>Load example movies to explore the log and dashboard. This adds sample records to your current data.</p><button class="btn" id="loadDemoSettings">Load sample data</button></section><section class="setting-item" style="grid-column:1/-1"><h3>Cloud account and sync</h3><p>Connect a Supabase project to sync your library between devices. Only the project URL and public publishable/anon key belong here. Never enter a service-role or secret key. Your local data stays available if cloud sync is disconnected.</p><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:12px"><div><label for="cloudUrl">Supabase project URL</label><input id="cloudUrl" type="url" placeholder="https://your-project.supabase.co" autocomplete="off"></div><div><label for="cloudKey">Publishable / anon key</label><input id="cloudKey" type="password" placeholder="Paste the public key" autocomplete="off"></div></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px"><button class="btn primary" id="cloudSetup">Save cloud settings</button><button class="btn" id="cloudSignOut" style="display:none">Sign out</button></div><div id="cloudAuthArea" style="border-top:1px solid var(--line);padding-top:14px"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:10px"><div><label for="cloudEmail">Email</label><input id="cloudEmail" type="email" placeholder="you@example.com" autocomplete="username"></div><div><label for="cloudPassword">Password</label><input id="cloudPassword" type="password" placeholder="At least 8 characters" autocomplete="current-password"></div></div><div id="cloudAuthButtons" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="cloudSignIn">Sign in</button><button class="btn" id="cloudSignUp">Create account</button></div></div><div style="margin-top:14px;display:flex;gap:9px;align-items:center;flex-wrap:wrap"><span class="pill warn" id="cloudStatusPill">Not configured</span><span id="cloudStatusText" style="font-size:12px;color:var(--muted)">Enter your Supabase project URL and publishable/anon key.</span></div><div id="cloudResolveButtons" class="hide" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn primary" id="cloudUseCopy">Use cloud copy on this device</button><button class="btn danger" id="cloudUploadCopy">Replace cloud with this device</button></div><p style="margin-top:14px">This build uses a single cloud JSON record protected by row-level security. It does not yet provide automatic daily/90-day backups. Keep exporting JSON backups until a separate backup system is implemented.</p></section><section class="setting-item"><h3>Clear local data</h3><p>Remove all movies, viewings and watchlist items stored by this app in this browser. Export a backup first.</p><button class="btn danger" id="clearData">Clear all local data</button></section></div><p class="footer-note">Privacy note: this version stores data in your browser's local storage. Anyone with access to this browser profile may be able to access the data. Do not treat this as a cloud-backed or authenticated production app yet.</p>`;$('titlePref').value=prefs.language;$('titlePref').onchange=e=>{prefs.language=e.target.value;save();render()};$('settingTheme').onclick=toggleTheme;
if(cloudConfig){$('cloudUrl').value=cloudConfig.url||'';$('cloudKey').value=cloudConfig.key||''} $('cloudSetup').onclick=saveCloudConfig;$('cloudSignIn').onclick=()=>cloudSignIn(false);$('cloudSignUp').onclick=()=>cloudSignIn(true);$('cloudSignOut').onclick=cloudSignOut;$('cloudUseCopy').onclick=useCloudCopy;$('cloudUploadCopy').onclick=uploadLocalCopy;renderCloudControls();$('exportJson').onclick=exportJson;$('exportCsv').onclick=exportCsv;$('importBtn').onclick=importJson;$('storageRefresh').onclick=storageInfo;$('loadDemoSettings').onclick=loadDemo;$('clearData').onclick=()=>{if(confirm('Delete ALL locally stored movie data from this browser? Export a backup first.')){state={movies:[],viewings:[],watchlist:[],tags:[]};save();renderSettings();toast('Local data cleared')}};storageInfo()}
function storageInfo(){let bytes=0;try{bytes=new Blob([localStorage.getItem(KEY)||'']).size}catch(e){}$('storageInfo').textContent=`Approx. ${(bytes/1024).toFixed(1)} KB used for movie data in this browser. Browser storage limits vary.`}
function toggleTheme(){prefs.theme=prefs.theme==='dark'?'light':'dark';save();render()}$('themeToggle').onclick=toggleTheme;$('menuBtn').onclick=()=>{const opts=navItems().map(([id,ic,label],i)=>`${i+1}. ${label}`).join('\n');openModal('Navigate',`<div class="navlist">${navItems().map(([id,ic,label])=>`<button class="navbtn" data-modalpage="${id}"><span class="navicon">${ic}</span>${label}</button>`).join('')}</div>`,`<button class="btn" id="closeNav">Close</button>`);$('closeNav').onclick=closeModal;document.querySelectorAll('[data-modalpage]').forEach(b=>b.onclick=()=>{closeModal();go(b.dataset.modalpage)})};
function download(name,text,type){let blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function exportJson(){download('my-movie-tracker-backup-'+today()+'.json',JSON.stringify({schemaVersion:1,exportedAt:new Date().toISOString(),...state},null,2),'application/json');toast('JSON backup downloaded')}function csvCell(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}function exportCsv(){let movies=[['movie_id','title','original_title','release_year','runtime','genres','tags','favorite','synopsis','movie_notes'],...state.movies.map(m=>[m.id,m.title,m.originalTitle,m.year,m.runtime,(m.genres||[]).join('|'),(m.tags||[]).join('|'),m.favorite,m.synopsis,m.notes])];let views=[['viewing_id','movie_id','title','start_date','finish_date','status','rating','rewatch','watched_with_wife','viewing_notes'],...state.viewings.map(v=>[v.id,v.movieId,movie(v.movieId)?.title,v.startDate,v.finishDate,v.status,v.rating,v.rewatch,v.watchedWithWife,v.notes])];download('my-movie-tracker-movies-'+today()+'.csv',movies.map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8');download('my-movie-tracker-viewings-'+today()+'.csv',views.map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8');toast('CSV files downloaded')}
function importJson(){let f=$('importFile').files[0];if(!f){toast('Choose a JSON backup file first.');return}let reader=new FileReader();reader.onload=()=>{try{let x=JSON.parse(reader.result);if(!Array.isArray(x.movies)||!Array.isArray(x.viewings)||!Array.isArray(x.watchlist))throw new Error('Not a valid My Movie Tracker backup');if(!confirm(`Import ${x.movies.length} movies, ${x.viewings.length} viewings and ${x.watchlist.length} watchlist items? This replaces current local data.`))return;state={movies:x.movies,viewings:x.viewings,watchlist:x.watchlist,tags:x.tags||[]};save();renderSettings();toast('Backup imported')}catch(e){toast('Import failed: '+e.message)}};reader.readAsText(f)}
function loadDemo(){if(!confirm('Add five sample movies and viewings to your current library?'))return;const samples=[['The Thing',1982,109,8.8,'Horror, Science Fiction','1982-10-13',true],['Halloween',1978,91,9.1,'Horror, Thriller','2026-10-01',true],['Jaws',1975,124,8.5,'Thriller, Adventure','2026-09-20',false],['Alien',1979,117,9.3,'Horror, Science Fiction','2026-09-14',true],['The Shining',1980,146,8.6,'Horror, Drama','2026-08-30',false]];samples.forEach(([title,year,runtime,rating,genres,start,wife],i)=>{if(state.movies.some(m=>m.title===title))return;let m={id:uid(),title,year,runtime,genres:genres.split(', '),tags:[],notes:'',synopsis:'',favorite:i===1,createdAt:new Date().toISOString()};state.movies.push(m);state.viewings.push({id:uid(),movieId:m.id,startDate:start,finishDate:start,status:'completed',rating,watchedWithWife:wife?'yes':'no',rewatch:false,notes:'Sample record. Replace or delete this entry.',createdAt:new Date().toISOString()})});save();go('log');toast('Sample records added')}
